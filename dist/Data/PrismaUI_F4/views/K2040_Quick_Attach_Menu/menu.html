<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K2040's Quick Attach Menu</title>
  <link rel="stylesheet" href="quick-menu.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { position: relative; }
    #focusHeartbeat { position: fixed; right: 0; bottom: 0; width: 2px; height: 2px; pointer-events: none; background: rgba(102,196,255,.01); }
  </style>
</head>
<body tabindex="-1">
  <div id="focusHeartbeat" aria-hidden="true"></div>
  <main id="quickMenu" aria-label="Weapon attachment menu"></main>
  <script src="quick-menu-renderer.js"></script>
  <script>
    (function() {
      "use strict";

      var currentPayload = null;
      var heartbeatTimer = 0;
      var heartbeatPhase = false;
      var keyboardActive = false;
      var lastNavigationTime = 0;
      var renderer = window.K2040QuickMenuRenderer.create(document.getElementById("quickMenu"), {
        onOptionActivated: function(category, option) {
          var selectionKey = String(category.categoryIndex) + ":" + String(option.optionIndex);
          renderer.setStatus("Checking “" + (renderer.displayName(option.label) || "Unnamed attachment") + "”…", "warning");
          if (typeof window.k2040OptionPreviewRequested === "function") {
            window.k2040OptionPreviewRequested(selectionKey);
          } else {
            renderer.setStatus("The game-side selection handler is unavailable.", "error");
          }
        }
      });

      function startFocusHeartbeat() {
        if (heartbeatTimer) return;
        var pixel = document.getElementById("focusHeartbeat");
        heartbeatTimer = window.setInterval(function() {
          heartbeatPhase = !heartbeatPhase;
          pixel.style.backgroundColor = heartbeatPhase ? "rgba(102,196,255,.02)" : "rgba(102,196,255,.01)";
        }, 500);
      }

      function stopFocusHeartbeat() {
        if (heartbeatTimer) window.clearInterval(heartbeatTimer);
        heartbeatTimer = 0;
      }

      window.k2040StartFocusHeartbeat = startFocusHeartbeat;
      window.k2040StopFocusHeartbeat = stopFocusHeartbeat;

      window.k2040FocusMenuInitial = function() {
        renderer.activePane = "categories";
        lastControllerSector = -1;
        renderer.render();
      };

      window.k2040SetPayload = function(payloadText) {
        try {
          currentPayload = JSON.parse(payloadText);
        } catch (error) {
          currentPayload = null;
          renderer.setPayload({ settings: {}, parser: { categories: [] }, weapon: {} });
          renderer.setStatus("The weapon menu data could not be read.", "error");
          return;
        }

        renderer.setPayload(currentPayload);
        var weapon = currentPayload.weapon || {};
        var parser = currentPayload.parser || {};
        var categories = renderer.visibleCategories();
        if (!weapon.hasWeapon) {
          renderer.setStatus("Equip a supported weapon and reopen the menu.", "error");
        } else if (!parser.valid || !categories.length) {
          renderer.setStatus(parser.status || "No usable menu is available for this weapon.", "error");
        } else {
          renderer.setStatus("", "");
        }
        startFocusHeartbeat();
      };

      window.k2040SetSelectionResult = function(resultText) {
        var result;
        try {
          result = JSON.parse(resultText);
        } catch (error) {
          renderer.setStatus("The selection result could not be read.", "error");
          return;
        }
        if (result.accepted) renderer.setStatus(result.message || "Selection is valid.", "success");
        else if (result.installed) renderer.setStatus(result.message || "This attachment is already installed.", "warning");
        else renderer.setStatus(result.message || "This attachment is unavailable.", "error");
      };

      window.addEventListener("focus", startFocusHeartbeat);

      function consumeKey(event) {
        event.preventDefault();
        event.stopPropagation();
        if (typeof event.stopImmediatePropagation === "function") event.stopImmediatePropagation();
      }

      function enterKeyboardMode() {
        var wasController = renderer.options.controllerActive;
        renderer.options.controllerActive = false;
        if (keyboardActive && !wasController) return;
        keyboardActive = true;
        renderer.options.keyboardActive = true;
        if (wasController) renderer.render();
      }

      function enterControllerMode() {
        keyboardActive = true;
        renderer.options.keyboardActive = true;
        if (!renderer.options.controllerActive) {
          renderer.options.controllerActive = true;
          renderer.render();
        }
      }

      var lastControllerSector = -1;
      window.k2040ControllerStickSector = function(value) {
        var sector = Number(value);
        if (!Number.isInteger(sector) || sector < 0 || sector >= 72) return;
        lastControllerSector = sector;
        enterControllerMode();
        renderer.selectRadialSector(sector);
      };

      function forwardConfiguredHotkey(keycode, shift, ctrl, alt) {
        var settings = currentPayload && currentPayload.settings ? currentPayload.settings : {};
        var modifiers = (shift ? 1 : 0) | (ctrl ? 2 : 0) | (alt ? 4 : 0);
        var action = "";
        if (Number(settings.openMenuHotkeyKeycode) === keycode &&
            Number(settings.openMenuHotkeyModifiers || 0) === modifiers) {
          action = "quick";
        } else if (Number(settings.openMenuBuilderHotkeyKeycode) === keycode &&
                   Number(settings.openMenuBuilderHotkeyModifiers || 0) === modifiers) {
          action = "builder";
        }
        if (!action || typeof window.k2040HotkeyActionRequested !== "function") return false;
        window.k2040HotkeyActionRequested(action);
        return true;
      }

      document.addEventListener("mousedown", function(event) {
        var keycode = event.button === 1 ? 258 : event.button === 3 ? 259 : event.button === 4 ? 260 : 0;
        if (keycode && forwardConfiguredHotkey(keycode, !!event.shiftKey, !!event.ctrlKey, !!event.altKey)) {
          consumeKey(event);
        }
      }, true);

      document.addEventListener("keydown", function(event) {
        var keycode = Number(event.keyCode || event.which || 0);
        if (!event.repeat && forwardConfiguredHotkey(keycode, !!event.shiftKey, !!event.ctrlKey, !!event.altKey)) {
          consumeKey(event);
          return;
        }
        var key = event.key && event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (key === "Escape" || key === " " || key === "Spacebar") {
          consumeKey(event);
          return;
        }
        if (key === "Enter") {
          consumeKey(event);
          enterKeyboardMode();
          if (!event.repeat) renderer.activateFocusedOption();
          return;
        }
        var navigation = key === "ArrowLeft" || key === "a" || key === "ArrowRight" || key === "d" ||
          key === "ArrowUp" || key === "w" || key === "ArrowDown" || key === "s";
        if (!navigation) return;
        consumeKey(event);
        enterKeyboardMode();
        var now = Date.now();
        if (event.repeat && now - lastNavigationTime < 90) return;
        lastNavigationTime = now;
        if (key === "ArrowLeft" || key === "a") renderer.switchPane(-1);
        else if (key === "ArrowRight" || key === "d") renderer.switchPane(1);
        else if (key === "ArrowUp" || key === "w") renderer.activePane === "categories" ? renderer.moveCategory(-1) : renderer.moveOption(-1);
        else renderer.activePane === "categories" ? renderer.moveCategory(1) : renderer.moveOption(1);
      });

      window.addEventListener("prisma-controller-action", function(event) {
        var detail = event && event.detail;
        if (!detail || (detail.state !== "pressed" && detail.state !== "repeat")) return;
        var button = String(detail.button || "");
        var repeating = detail.state === "repeat";
        if (repeating && ["DUp","DDown","DLeft","DRight"].indexOf(button) < 0) return;

        enterControllerMode();
        var radial = renderer.settings().presentation === "radial";
        if (button === "A" && !repeating) {
          var enteringOptions = renderer.activePane === "categories";
          renderer.activateFocusedOption();
          if (radial && enteringOptions && lastControllerSector >= 0) {
            renderer.selectRadialSector(lastControllerSector);
          }
        } else if (button === "B" && !repeating) {
          if (radial && renderer.activePane === "options") renderer.switchPane(-1);
          else if (typeof window.k2040CloseRequested === "function") window.k2040CloseRequested("controller");
        } else if ((button === "LB" || button === "RB") && !repeating) {
          if (radial) renderer.activePane = "categories";
          renderer.moveCategory(button === "LB" ? -1 : 1);
          if (!radial) {
            renderer.activePane = "options";
            renderer.render();
          }
        } else if (button === "DLeft") {
          if (radial) {
            if (renderer.activePane === "options") renderer.switchPane(-1);
          } else renderer.switchPane(-1);
        } else if (button === "DRight") {
          if (!radial) renderer.switchPane(1);
          // Radial never uses rightward D-pad input to enter the outer ring.
        } else if (button === "DUp") {
          if (renderer.activePane === "categories") renderer.moveCategory(-1);
          else renderer.moveOption(-1);
        } else if (button === "DDown") {
          if (renderer.activePane === "categories") renderer.moveCategory(1);
          else renderer.moveOption(1);
        } else return;

        event.stopImmediatePropagation();
      });

      document.addEventListener("mousemove", function() {
        if (!keyboardActive) return;
        keyboardActive = false;
        renderer.options.keyboardActive = false;
        renderer.options.controllerActive = false;
        renderer.render();
      });
    })();
  </script>
</body>
</html>
