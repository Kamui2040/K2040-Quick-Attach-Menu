; K2040's Quick Attach Menu default configuration
; Existing user INIs are never overwritten by the plugin.
; If this file is missing, the plugin recreates these defaults on startup.

[General]
ConfigVersion=1

[Hotkeys]
OpenMenu=Shift+K
OpenMenuBuilder=Ctrl+Shift+K

[UI]
UseGameUIColor=true
Scale=1.0
PositionX=0.5
PositionY=0.5
ShowControlHints=false
HideBracketedText=false

[Behavior]
CloseAfterApply=false

[Runtime]
HideInvalidOptions=true
MenuSource=Auto
AutoInstallProviderIfSafe=false
RemoveDependentChildrenFirst=true
AllowNoLooseModOptions=true
